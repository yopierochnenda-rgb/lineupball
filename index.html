<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>OBS Volleyball Overlay - Pro Sport Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,800;0,900;1,900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: transparent;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Padding atas dilebihkan agar judul tim tidak kepotong di kanvas vertikal */
            padding: 80px 20px 20px 20px; 
            overflow: hidden;
            color: #ffffff;
        }

        .status-box {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-left: 4px solid #ffaa00;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
        }
        .pin-code {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            color: #ffaa00;
        }

        .graphic-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
            transform: scale(0.92);
        }

        /* Desain Tim Sporty Bergaransi Garang */
        .team-header {
            background: linear-gradient(135deg, #0b132b, #1c2541, #3a506b);
            color: #ffffff;
            padding: 12px 20px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-radius: 10px 10px 0 0;
            width: 380px;
            text-align: center;
            border: 2px solid #ffaa00;
            border-bottom: 3px solid #ffaa00;
            box-shadow: 0 -5px 20px rgba(255, 170, 0, 0.3);
            position: relative;
        }
        
        .team-header::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0; right: 0;
            height: 3px;
            background: #ffaa00;
        }

        .court-title {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: #fff;
            padding: 5px 20px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            width: 380px;
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
            margin-top: -2px;
            z-index: 3;
        }

        /* Lapangan Sporty Style */
        .court {
            width: 380px;
            height: 360px;
            background: linear-gradient(135deg, rgba(11, 19, 43, 0.9), rgba(5, 8, 20, 0.95));
            backdrop-filter: blur(12px);
            border-left: 3px solid #3a506b;
            border-right: 3px solid #3a506b;
            position: relative;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            padding: 10px;
            gap: 10px;
        }

        /* Garis Serang Lapangan Voli */
        .court::before {
            content: '';
            position: absolute;
            top: 33.33%;
            left: 0; right: 0;
            height: 3px;
            background-color: #00e5ff;
            box-shadow: 0 0 12px #00e5ff;
            z-index: 1;
        }

        /* Garis Net Animasi */
        .net {
            position: absolute;
            top: -6px; left: -10px; right: -10px;
            height: 12px;
            background: repeating-linear-gradient(90deg, #ffffff, #ffffff 4px, #1c2541 4px, #1c2541 8px);
            border-radius: 6px;
            z-index: 5;
            box-shadow: 0 2px 8px rgba(0,229,255,0.5);
        }

        .player-spot {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4px;
            z-index: 2;
            position: relative;
            transition: all 0.3s;
        }

        .pos-number { 
            font-family: 'Oswald', sans-serif;
            font-size: 0.65rem; 
            color: #8d99ae; 
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .player-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 100%;
        }

        /* Nomor Punggung Jersey Style */
        .player-number {
            font-family: 'Oswald', sans-serif;
            background: #ffaa00;
            color: #0b132b;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;
            display: none;
            box-shadow: 0 0 8px rgba(255,170,0,0.5);
        }

        .name { 
            font-family: 'Montserrat', sans-serif;
            font-weight: 900; 
            font-size: 0.82rem; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9); 
            word-break: break-word;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Ketika kotak diisi pemain, beri efek menyala biru sporty */
        .player-spot.filled {
            background: linear-gradient(135deg, rgba(0, 119, 182, 0.75), rgba(3, 4, 94, 0.85));
            border: 1px solid #00e5ff;
            box-shadow: inset 0 0 10px rgba(0,229,255,0.2);
        }
        .player-spot.filled .pos-number { color: #00e5ff; }

        /* Bagian Cadangan & Libero */
        .extra-section {
            width: 380px;
            background: rgba(11, 19, 43, 0.95);
            backdrop-filter: blur(12px);
            border: 2px solid #3a506b;
            border-top: none;
            border-radius: 0 0 10px 10px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .extra-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 12px;
            border-radius: 4px;
            border-left: 3px solid #ff4b2b;
        }

        .extra-row .label {
            font-family: 'Oswald', sans-serif;
            color: #ffaa00;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .extra-row-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .extra-number {
            font-family: 'Oswald', sans-serif;
            background: #ffaa00;
            color: #0b132b;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;
            display: none;
        }

        .extra-row .val {
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #spot-4 { grid-column: 1; grid-row: 1; }
        #spot-3 { grid-column: 2; grid-row: 1; }
        #spot-2 { grid-column: 3; grid-row: 1; }
        #spot-5 { grid-column: 1; grid-row: 2; }
        #spot-6 { grid-column: 2; grid-row: 2; }
        #spot-1 { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <div class="status-box">
        REMOTE: <span id="status-text" style="color: #ff4b2b;">DISCONNECTED</span><br>
        PIN: <span class="pin-code" id="pin-display">....</span>
    </div>

    <div class="graphic-container">
        <div class="team-header" id="display-team-name">NAMA TIM / KLUB</div>
        <div class="court-title">STARTING LINE-UP</div>
        
        <div class="court">
            <div class="net"></div>
            
            <div class="player-spot" id="spot-4">
                <span class="pos-number">POS 4</span>
                <div class="player-info">
                    <span class="player-number" id="num-4"></span>
                    <span class="name" id="name-4">-</span>
                </div>
            </div>
            <div class="player-spot" id="spot-3">
                <span class="pos-number">POS 3</span>
                <div class="player-info">
                    <span class="player-number" id="num-3"></span>
                    <span class="name" id="name-3">-</span>
                </div>
            </div>
            <div class="player-spot" id="spot-2">
                <span class="pos-number">POS 2</span>
                <div class="player-info">
                    <span class="player-number" id="num-2"></span>
                    <span class="name" id="name-2">-</span>
                </div>
            </div>
            <div class="player-spot" id="spot-5">
                <span class="pos-number">POS 5</span>
                <div class="player-info">
                    <span class="player-number" id="num-5"></span>
                    <span class="name" id="name-5">-</span>
                </div>
            </div>
            <div class="player-spot" id="spot-6">
                <span class="pos-number">POS 6</span>
                <div class="player-info">
                    <span class="player-number" id="num-6"></span>
                    <span class="name" id="name-6">-</span>
                </div>
            </div>
            <div class="player-spot" id="spot-1">
                <span class="pos-number">POS 1</span>
                <div class="player-info">
                    <span class="player-number" id="num-1"></span>
                    <span class="name" id="name-1">-</span>
                </div>
            </div>
        </div>

        <div class="extra-section">
            <div class="extra-row">
                <span class="label">LIBERO</span>
                <div class="extra-row-info">
                    <span class="extra-number" id="num-libero"></span>
                    <span class="val" id="name-libero">-</span>
                </div>
            </div>
            <div class="extra-row">
                <span class="label">CADANGAN 1</span>
                <div class="extra-row-info">
                    <span class="extra-number" id="num-sub1"></span>
                    <span class="val" id="name-sub1">-</span>
                </div>
            </div>
            <div class="extra-row">
                <span class="label">CADANGAN 2</span>
                <div class="extra-row-info">
                    <span class="extra-number" id="num-sub2"></span>
                    <span class="val" id="name-sub2">-</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const randomPin = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('pin-display').textContent = randomPin;

        const peer = new Peer(`volleyball-obs-${randomPin}`);

        peer.on('connection', (conn) => {
            const statusText = document.getElementById('status-text');
            statusText.textContent = 'CONNECTED';
            statusText.style.color = '#00e5ff';

            conn.on('data', (data) => {
                if (data.type === 'team') {
                    document.getElementById('display-team-name').textContent = data.val.trim() === '' ? 'NAMA TIM / KLUB' : data.val.toUpperCase();
                    return;
                }

                if (data.type === 'name') {
                    const displayField = document.getElementById(`name-${data.pos}`);
                    const spotDisplay = document.getElementById(`spot-${data.pos}`);

                    if (displayField) {
                        const nama = data.val.trim();
                        displayField.textContent = nama === '' ? '-' : nama;

                        if (spotDisplay) {
                            if (nama !== '') {
                                spotDisplay.classList.add('filled');
                            } else {
                                spotDisplay.classList.remove('filled');
                            }
                        }
                    }
                }

                if (data.type === 'num') {
                    let numField = document.getElementById(`num-${data.pos}`);
                    if (numField) {
                        const no = data.val.trim();
                        if (no !== '') {
                            numField.textContent = no;
                            numField.style.display = 'inline-block';
                        } else {
                            numField.textContent = '';
                            numField.style.display = 'none';
                        }
                    }
                }
            });
            
            conn.on('close', () => {
                statusText.textContent = 'DISCONNECTED';
                statusText.style.color = '#ff4b2b';
            });
        });
    </script>
</body>
</html>
